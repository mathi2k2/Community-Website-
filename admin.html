<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bloomfield BCCC — Admin Portal</title>
  <link rel="icon" href="assets/images/bccc-logo.svg">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- ═══ Login Modal ═══ -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <img src="assets/images/bccc-logo.svg" alt="BCCC" class="login-logo" width="80" height="80">
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Bloomfield Cricket &amp; Cultural Club</p>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="login-email">Username</label>
          <input type="text" id="login-email" value="admin" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Admin password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- ═══ App Shell ═══ -->
  <div class="app" id="app" hidden>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="assets/images/bccc-logo.svg" alt="BCCC" width="40" height="40" class="sidebar-logo">
        <span class="sidebar-brand">BCCC Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active" data-section="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="#" class="sidebar-link" data-section="profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Site Profile
        </a>
        <a href="#" class="sidebar-link" data-section="events">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Events
        </a>
        <a href="#" class="sidebar-link" data-section="gallery">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Gallery
        </a>
        <a href="#" class="sidebar-link" data-section="faqs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          FAQs
        </a>
        <a href="#" class="sidebar-link" data-section="programs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Programs
        </a>
        <a href="#" class="sidebar-link" data-section="players">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Players
        </a>
        <a href="#" class="sidebar-link" data-section="tickets">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h6l2-7 4 14 2-7h6"/></svg>
          Tickets
        </a>
        <a href="#" class="sidebar-link" data-section="payments">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Payments
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sign Out</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <header class="topbar">
        <button class="topbar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="topbar-title" id="page-title">Dashboard</h1>
      </header>

      <div class="content-area" id="content-area">
        <!-- Dynamically rendered by JS -->
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
