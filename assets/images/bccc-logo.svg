<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="#b91c1c" stroke="#d4a017" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#d4a017" stroke-width="2"/>

  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="78" fill="#1a1a2e"/>

  <!-- Text ring - top: Bloomfield Cricket and Cultural Club -->
  <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#d4a017" letter-spacing="1.5" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">BLOOMFIELD CRICKET &amp; CULTURAL CLUB</textPath>
  </text>

  <!-- Text ring - bottom: Winnipeg, Manitoba, Canada -->
  <path id="bottomArc" d="M 170,108 A 70,70 0 0,1 30,108" fill="none"/>
  <text font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#d4a017" letter-spacing="1.2" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">WINNIPEG, MANITOBA, CANADA</textPath>
  </text>

  <!-- Lion body (simplified Sri Lankan style) -->
  <g transform="translate(100,95) scale(0.9)" fill="#d4a017">
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="18" ry="14"/>
    <!-- Chest -->
    <ellipse cx="-8" cy="-2" rx="10" ry="12"/>
    <!-- Head -->
    <circle cx="-14" cy="-18" r="10"/>
    <!-- Mane -->
    <circle cx="-14" cy="-22" r="7" fill="#b8860b"/>
    <circle cx="-9" cy="-24" r="5" fill="#b8860b"/>
    <circle cx="-19" cy="-24" r="5" fill="#b8860b"/>
    <circle cx="-20" cy="-18" r="5" fill="#b8860b"/>
    <circle cx="-8" cy="-18" r="5" fill="#b8860b"/>
    <!-- Head overlay -->
    <circle cx="-14" cy="-18" r="8" fill="#d4a017"/>
    <!-- Ear -->
    <ellipse cx="-10" cy="-26" rx="3" ry="4" fill="#d4a017"/>
    <!-- Eye -->
    <circle cx="-11" cy="-19" r="1.5" fill="#1a1a2e"/>
    <!-- Nose -->
    <circle cx="-7" cy="-17" r="1" fill="#1a1a2e"/>
    <!-- Mouth open -->
    <path d="M-6,-15 Q-4,-12 -7,-11" stroke="#1a1a2e" stroke-width="1" fill="none"/>
    <!-- Front raised paw -->
    <path d="M-16,6 L-26,-8 L-28,-6 L-24,-2 L-28,0 L-22,6" fill="#d4a017"/>
    <!-- Sword in paw -->
    <rect x="-29" y="-20" width="2" height="18" rx="1" fill="#c0c0c0" transform="rotate(-10,-28,-11)"/>
    <rect x="-31" y="-6" width="6" height="2" rx="1" fill="#c0c0c0" transform="rotate(-10,-28,-5)"/>
    <!-- Back legs -->
    <path d="M10,18 L8,30 L14,30 L12,18" fill="#d4a017"/>
    <path d="M2,20 L0,30 L6,30 L6,18" fill="#d4a017"/>
    <!-- Tail (curled up) -->
    <path d="M18,4 Q28,-2 24,-14 Q22,-20 18,-18" stroke="#d4a017" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <circle cx="17" cy="-18" r="4" fill="#b8860b"/>
  </g>

  <!-- BCCC text below lion -->
  <text x="100" y="142" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#d4a017" text-anchor="middle" letter-spacing="4">BCCC</text>

  <!-- Small decorative dots -->
  <circle cx="55" cy="100" r="2" fill="#d4a017"/>
  <circle cx="145" cy="100" r="2" fill="#d4a017"/>
</svg>
